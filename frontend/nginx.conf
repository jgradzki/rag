server {
    listen 80;
    root /usr/share/nginx/html;

    # The backend enforces MAX_UPLOAD_MB per file; this only caps a whole request.
    client_max_body_size 100m;

    location /api/ {
        # Answer a request over client_max_body_size in the backend's JSON error shape,
        # so the UI shows a message instead of nginx's HTML page.
        error_page 413 = @too_large;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Stream chat tokens (Server-Sent Events) as they arrive instead of buffering.
        proxy_buffering off;
        # Local models can take minutes to answer; indexing a big file too.
        proxy_read_timeout 600s;
    }

    location @too_large {
        default_type application/json;
        return 413 '{"detail":"Upload too large (at most 100 MB per request in Docker, and MAX_UPLOAD_MB per file)"}';
    }

    # Hashed build files never change - cache them, and 404 a missing one instead of
    # answering with index.html (which a browser would reject as a script).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html names the current hashed files, so always revalidate it after a rebuild.
    # The CSP lets the page load and contact only this origin - a second fence (after the
    # chat UI not rendering images) against answers that try to send data elsewhere.
    # add_header in a location replaces the server-level ones, so both live here.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    }
}
